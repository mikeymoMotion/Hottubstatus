[fridgecam]
# Your site's address.
site_url = https://ismikeshottubready.com

# The camera password: the same text as line 13 of index.php on Bluehost.
camera_key = your-camera-password

# GPIO numbers (not physical pin numbers). See README.md for the wiring.
door_pin = 17
led_pin = 18

# "low" for a normally open (NO) door switch, "high" for normally closed (NC).
# If "python3 fridgecam.py --door" says OPEN when the door is shut, switch this.
door_closed_when = low

# LED brightness for photos, from 0.1 to 1.0. Lower it if photos look washed out.
led_brightness = 1.0

# How long to wait after the door closes before taking the photo, in seconds.
# Gives the lens time to clear, and lets several quick trips to the fridge
# share one photo.
settle_seconds = 90

# At most one photo per this many minutes, to keep API costs down during parties.
min_minutes_between_photos = 10

# Also take a photo if none was taken in this many hours, so the site's
# "Checked ... ago" stays fresh. Set to 0 to turn off.
refresh_hours = 24

# Extra options for the camera, e.g. "--rotation 180" if it's mounted upside down,
# or "--hflip --vflip". Leave empty for none.
camera_args =
