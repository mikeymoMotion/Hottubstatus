<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hot Tub Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background: #1b2a4a;
      overflow: hidden;
    }

    /* Two stacked gradient layers so we can crossfade between them. */
    .bg {
      position: fixed;
      inset: 0;
      transition: opacity 1.2s ease;
    }
    .bg-warm { background: linear-gradient(160deg, #ffb347 0%, #ff7b54 45%, #d7385e 100%); opacity: 0; }
    .bg-cool { background: linear-gradient(160deg, #3a7bd5 0%, #1f4e8c 50%, #0f2027 100%); }
    body.ready .bg-warm { opacity: 1; }
    body.ready .bg-cool { opacity: 0; }

    /* Steam */
    .steam {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    body.ready .steam { opacity: 1; }

    .wisp {
      position: absolute;
      bottom: -20vh;
      width: 16vmax;
      height: 34vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 70%);
      filter: blur(18px);
      opacity: 0;
      animation: rise 12s ease-in infinite;
    }
    .wisp:nth-child(1) { left: 5%;  animation-delay: 0s;   animation-duration: 13s; }
    .wisp:nth-child(2) { left: 22%; animation-delay: 3s;   animation-duration: 11s; }
    .wisp:nth-child(3) { left: 40%; animation-delay: 6s;   animation-duration: 14s; }
    .wisp:nth-child(4) { left: 58%; animation-delay: 1.5s; animation-duration: 12s; }
    .wisp:nth-child(5) { left: 74%; animation-delay: 4.5s; animation-duration: 13s; }
    .wisp:nth-child(6) { left: 88%; animation-delay: 8s;   animation-duration: 11s; }

    @keyframes rise {
      0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
      15%  { opacity: 0.7; }
      50%  { transform: translate(3vw, -50vh) scale(1.1); opacity: 0.4; }
      100% { transform: translate(-2vw, -100vh) scale(1.6); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wisp { animation: none; }
      .steam { display: none; }
    }

    /* Status */
    main {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
    }
    .label {
      font-size: clamp(1rem, 3vw, 1.6rem);
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.8;
      margin-bottom: 0.5em;
    }
    #status {
      font-size: clamp(1.75rem, 9vw, 6.5rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-shadow: 0 6px 30px rgba(0,0,0,0.25);
    }

    /* Admin controls: a faint lock in the corner, and a switch once unlocked. */
    .admin {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lock {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      opacity: 0.25;
      cursor: pointer;
      padding: 8px;
    }
    .lock:hover { opacity: 0.7; }

    .login { display: none; gap: 8px; }
    .login.open { display: flex; }
    .login input, .login button {
      font: inherit;
      font-size: 0.9rem;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.25);
      color: #fff;
    }
    .login button { cursor: pointer; }

    .switch { display: none; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    body.admin-on .switch { display: flex; }
    body.admin-on .lock { display: none; }
    .switch input { display: none; }
    .track {
      width: 60px;
      height: 32px;
      border-radius: 16px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.4);
      position: relative;
      transition: background 0.3s;
    }
    .track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.3s;
    }
    .switch input:checked + .track { background: rgba(255,255,255,0.35); }
    .switch input:checked + .track::after { transform: translateX(28px); }
  </style>
</head>
<body>
  <div class="bg bg-cool"></div>
  <div class="bg bg-warm"></div>
  <div class="steam" aria-hidden="true">
    <div class="wisp"></div><div class="wisp"></div><div class="wisp"></div>
    <div class="wisp"></div><div class="wisp"></div><div class="wisp"></div>
  </div>

  <main>
    <div class="label">Hot Tub</div>
    <h1 id="status">&nbsp;</h1>
  </main>

  <div class="admin">
    <form class="login" id="login">
      <input type="password" id="password" placeholder="Admin password" autocomplete="current-password">
      <button type="submit">Unlock</button>
    </form>
    <label class="switch">
      <span>Ready</span>
      <input type="checkbox" id="toggle">
      <span class="track"></span>
    </label>
    <button class="lock" id="lock" title="Admin" aria-label="Admin">&#128274;</button>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const toggle = document.getElementById("toggle");
    const loginForm = document.getElementById("login");
    const passwordInput = document.getElementById("password");
    const KEY = "hottub-admin-password";

    function getPassword() {
      try { return localStorage.getItem(KEY); } catch { return null; }
    }
    function setPassword(pw) {
      try { pw ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch {}
    }

    function render(ready) {
      statusEl.textContent = ready ? "Ready" : "Not Ready";
      document.body.classList.toggle("ready", ready);
      toggle.checked = ready;
    }

    async function refresh() {
      try {
        const res = await fetch("api.php", { cache: "no-store" });
        render((await res.json()).ready);
      } catch {}
    }

    async function login(pw) {
      const res = await fetch("api.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "login", password: pw }),
      });
      if (!res.ok) return false;
      setPassword(pw);
      document.body.classList.add("admin-on");
      loginForm.classList.remove("open");
      return true;
    }

    document.getElementById("lock").addEventListener("click", () => {
      loginForm.classList.toggle("open");
      passwordInput.focus();
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!(await login(passwordInput.value))) {
        passwordInput.value = "";
        passwordInput.placeholder = "Wrong password";
      }
    });

    toggle.addEventListener("change", async () => {
      const ready = toggle.checked;
      render(ready);
      const res = await fetch("api.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ready, password: getPassword() }),
      });
      if (res.status === 401) {
        setPassword(null);
        document.body.classList.remove("admin-on");
      }
      refresh();
    });

    const saved = getPassword();
    if (saved) login(saved);

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
